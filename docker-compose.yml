services:
  mongo:
    image: mongo:7
    container_name: kanban-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: kanban-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/kanban-mvp
      FRONTEND_URL: http://localhost:5173
      ACCESS_TOKEN_SECRET: docker-access-secret-change-me
      REFRESH_TOKEN_SECRET: docker-refresh-secret-change-me
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
    container_name: kanban-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  mongo_data:
